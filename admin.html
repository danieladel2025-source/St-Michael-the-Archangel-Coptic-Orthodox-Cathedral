<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- ===== التحديث التلقائي: يخفي شاشة البداية/الاختيار/الدخول مؤقتاً أثناء إعادة التحميل التلقائي فقط ===== -->
<script>
(function(){try{var m=JSON.parse(sessionStorage.getItem('auto_refresh_marker_v1')||'null');
if(m&&Date.now()-m.t<30000){var c=document.documentElement.classList;c.add('ar-r');
if(m.inChapter)c.add('ar-r-chapter');if(m.inDash)c.add('ar-r-dash');}}catch(e){}})();
</script>
<style>
html.ar-r #splashScreen,html.ar-r-chapter #chapterGate,html.ar-r-dash #loginScreen{display:none!important}
</style>
<title>لوحة المشرفين — كاتدرائية رئيس الملائكة الجليل ميخائيل - طنطا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./live-chat.js"></script>
<script src="./push-client.js"></script>
<style>
  :root {
    --ink: #0d1117;
    --navy: #121a2b;
    --paper: #f5f0e8;
    --cream: #ede8dc;
    --accent: #c8392b;
    --accent2: #2980b9;
    --gold: #d4a017;
    --green: #1a7a4a;
    --line: #b5a98a;
    --shadow: rgba(13,17,23,0.14);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; overflow-x:hidden; }
  img, video { max-width:100%; }
  body {
    max-width:100vw; overflow-x:hidden;
    font-family:'Cairo', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height:100vh;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 38px, var(--line) 38px, var(--line) 39px),
      repeating-linear-gradient(90deg, transparent, transparent 38px, rgba(181,169,138,0.15) 38px, rgba(181,169,138,0.15) 39px);
  }

  /* ===== شاشة الدخول ===== */
  #loginScreen {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-card {
    background:#fff;
    width:100%;
    max-width:400px;
    border-radius:14px;
    box-shadow:0 20px 50px var(--shadow);
    border-top:6px solid var(--gold);
    padding:36px 32px 30px;
    position:relative;
  }
  .seal {
    width:64px; height:64px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--navy), var(--ink));
    border:3px solid var(--gold);
    color: var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size:28px;
    margin:0 auto 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .login-title { text-align:center; font-size:19px; font-weight:900; color:var(--ink); }
  .login-sub { text-align:center; font-size:12.5px; color:#8a8272; margin-top:4px; margin-bottom:24px; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:12.5px; font-weight:700; color:#555; margin-bottom:6px; }
  .field input {
    width:100%; padding:11px 14px; border:1.5px solid var(--cream);
    border-radius:9px; font-family:'Cairo',sans-serif; font-size:14px;
    background:#fbfaf7; transition:border-color .2s;
  }
  .field input:focus { outline:none; border-color:var(--accent2); }
  .login-btn {
    width:100%; padding:12px; border:none; border-radius:9px;
    background:var(--ink); color:#fff; font-family:'Cairo',sans-serif;
    font-size:15px; font-weight:700; cursor:pointer; margin-top:6px;
    transition: background .2s;
  }
  .login-btn:hover { background:var(--navy); }
  .login-btn:disabled { opacity:.6; cursor:default; }
  .login-error {
    background:#fee2e2; color:#991b1b; border:1px solid #fecaca;
    border-radius:8px; padding:9px 12px; font-size:12.5px; margin-bottom:14px; display:none;
  }
  .login-note { text-align:center; font-size:11px; color:#aaa; margin-top:18px; line-height:1.7; }

  /* ===== لوحة الإدارة ===== */
  #dashScreen { display:none; }
  .header {
    background: var(--navy);
    color: var(--paper);
    padding:16px 26px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 20px var(--shadow);
    position:sticky; top:0; z-index:100;
    flex-wrap:wrap; gap:12px;
  }
  .header-brand { display:flex; align-items:center; gap:12px; }
  .header-icon {
    width:42px; height:42px; background:var(--gold); color:var(--ink);
    border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .header h1 { font-size:18px; font-weight:900; }
  .header-subtitle { font-size:11.5px; color:#a8b0c0; margin-top:2px; }
  .header-actions { display:flex; gap:10px; align-items:center; }
  .btn {
    border:none; border-radius:8px; padding:9px 16px; font-family:'Cairo',sans-serif;
    font-size:13px; font-weight:700; cursor:pointer; transition:opacity .2s;
  }
  .btn:hover { opacity:.88; }
  .btn-outline { background:transparent; border:1.5px solid rgba(245,240,232,0.4); color:var(--paper); }
  .btn-gold { background:var(--gold); color:var(--ink); }
  .btn-red { background:var(--accent); color:#fff; }
  .btn-blue { background:var(--accent2); color:#fff; }

  .container { max-width:1180px; margin:0 auto; padding:22px 18px 60px; }

  .toolbar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
  .search-box {
    flex:1; min-width:220px; padding:11px 16px; border-radius:10px;
    border:1.5px solid var(--cream); background:#fff; font-family:'Cairo',sans-serif; font-size:14px;
  }
  .search-box:focus { outline:none; border-color:var(--accent2); }
  .summary-pill {
    background:#fff; border:1px solid var(--cream); border-radius:10px;
    padding:9px 16px; font-size:12.5px; font-weight:700; color:#555;
    box-shadow:0 2px 8px var(--shadow);
  }

  .class-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(270px,100%),1fr)); gap:16px; }
  .class-card {
    background:#fff; border:1px solid var(--cream); border-top:4px solid var(--accent2);
    border-radius:12px; padding:18px; box-shadow:0 4px 12px var(--shadow);
    cursor:pointer; transition:transform .15s, box-shadow .15s;
  }
  .class-card:hover { transform:translateY(-2px); box-shadow:0 8px 22px var(--shadow); }
  .class-card h3 { font-size:16px; font-weight:900; margin-bottom:6px; color:var(--ink); }
  .class-card .meta { font-size:11.5px; color:#999; margin-bottom:12px; }
  .class-card .stats { display:flex; gap:10px; flex-wrap:wrap; }
  .chip { background:var(--cream); border-radius:16px; padding:4px 11px; font-size:11.5px; font-weight:700; color:#5a5342; }
  .chip.green { background:#dcfce7; color:#166534; }
  .chip.blue { background:#dbeafe; color:#1d4ed8; }

  .sv-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .sv-wrap { overflow-x:auto; background:#fff; border-radius:12px; border:1px solid var(--cream); }
  .sv-wrap table.data-table { min-width:680px; }
  .an-form { background:#fff; border:1px solid var(--cream); border-radius:12px; padding:14px; margin-bottom:14px; display:grid; gap:10px; }
  .an-form label { font-size:12.5px; font-weight:700; color:#555; display:block; margin-bottom:4px; }
  .an-form input[type=text], .an-form input[type=date], .an-form select, .an-form textarea {
    width:100%; padding:10px 12px; border:2px solid var(--line); border-radius:10px; font-family:inherit; font-size:14px; background:#fff; color:var(--ink); }
  .an-form textarea { min-height:110px; resize:vertical; line-height:1.7; }
  .an-form input:focus, .an-form select:focus, .an-form textarea:focus { outline:none; border-color:var(--accent2); }
  .an-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:560px) { .an-row { grid-template-columns:1fr; } }
  .an-item { background:#fff; border:1px solid var(--cream); border-right:5px solid var(--green); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .an-item.off { border-right-color:#bbb; opacity:.75; }
  .an-item .an-t { font-weight:900; font-size:15px; margin-bottom:3px; }
  .an-item .an-tx { font-size:13.5px; line-height:1.8; white-space:pre-wrap; word-break:break-word; }
  .an-item .an-meta { font-size:11.5px; color:#888; margin:8px 0; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .an-item .an-act { display:flex; gap:8px; flex-wrap:wrap; }
  .sv-phone { direction:ltr; unicode-bidi:plaintext; font-weight:700; color:var(--accent2); text-decoration:none; white-space:nowrap; }
  .sv-edit { border:none; background:var(--cream); border-radius:8px; padding:3px 8px; cursor:pointer; font-size:12px; }
  .empty-state { text-align:center; padding:70px 20px; color:#999; }
  .empty-state .ic { font-size:44px; margin-bottom:12px; }

  /* ===== تفاصيل الفصل ===== */
  #chapterEditOverlay {
    display:none; position:fixed; inset:0; background:rgba(13,17,23,.6); z-index:1200;
    align-items:center; justify-content:center; padding:16px;
  }
  #chapterEditOverlay.active { display:flex; }
  .chapter-edit-modal {
    background:var(--paper); border-radius:14px; padding:22px; width:100%; max-width:420px;
    box-shadow:0 20px 50px var(--shadow);
  }
  .chapter-edit-modal h3 { margin:0 0 14px; font-size:17px; }
  .chapters-table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; }
  .chapters-table th, .chapters-table td { padding:11px 12px; text-align:right; border-bottom:1px solid var(--cream); font-size:13.5px; }
  .chapters-table th { background:var(--navy); color:var(--paper); font-weight:700; }
  .chapters-table td.actions { white-space:nowrap; }
  #detailOverlay {
    display:none; position:fixed; inset:0; background:rgba(13,17,23,0.55);
    z-index:500; align-items:flex-start; justify-content:center; overflow-y:auto; padding:26px 14px;
  }
  .detail-modal {
    background:#fdfcf9; width:100%; max-width:980px; border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35); overflow:hidden; margin-bottom:30px;
  }
  .detail-head {
    background:var(--ink); color:var(--paper); padding:20px 26px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;
  }
  .detail-head h2 { font-size:19px; font-weight:900; }
  .detail-head .meta { font-size:12px; color:#bbb; margin-top:4px; }
  .close-btn {
    background:rgba(255,255,255,0.12); border:none; color:#fff; width:34px; height:34px;
    border-radius:50%; font-size:16px; cursor:pointer;
  }
  .tabs { display:flex; gap:4px; padding:14px 22px 0; border-bottom:1px solid var(--cream); flex-wrap:wrap; }
  .tab-btn {
    border:none; background:transparent; padding:10px 16px; font-family:'Cairo',sans-serif;
    font-size:13.5px; font-weight:700; color:#888; cursor:pointer; border-bottom:3px solid transparent;
  }
  .tab-btn.active { color:var(--accent2); border-bottom-color:var(--accent2); }
  .tab-panel { display:none; padding:20px 22px 26px; }
  .tab-panel.active { display:block; }

  table.data-table { width:100%; border-collapse:collapse; font-size:13px; }
  table.data-table th {
    background:var(--cream); color:var(--ink); padding:9px 10px; text-align:right; font-size:12px; white-space:nowrap;
  }
  table.data-table td { padding:9px 10px; border-bottom:1px solid #f1ede4; }
  table.data-table tr:hover td { background:#faf8f3; }
  .pct-bar { width:70px; height:7px; background:#eee; border-radius:6px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:6px;}
  .pct-fill { height:100%; background:var(--green); }
  .no-data { text-align:center; color:#aaa; padding:30px; font-size:13px; }

  .loading-spin {
    display:inline-block; width:16px; height:16px; border:2.5px solid rgba(255,255,255,0.4);
    border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .toast {
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:#222; color:#fff; padding:11px 22px; border-radius:10px; font-size:13px;
    font-weight:700; z-index:9999; box-shadow:0 6px 20px rgba(0,0,0,0.3);
  }

  /* ===== بروفايل الطفل ===== */
  #studentOverlay {
    display:none; position:fixed; inset:0; background:rgba(13,17,23,0.65);
    z-index:600; align-items:flex-start; justify-content:center; overflow-y:auto; padding:26px 14px;
  }
  .student-modal {
    background:#fdfcf9; width:100%; max-width:620px; border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4); overflow:hidden; margin-bottom:30px;
  }
  .stu-row { display:flex; gap:18px; padding:20px 24px; align-items:flex-start; flex-wrap:wrap; }
  .stu-photo {
    width:88px; height:88px; border-radius:12px; object-fit:cover; border:2px solid var(--cream); flex-shrink:0;
  }
  .stu-photo-placeholder {
    width:88px; height:88px; border-radius:12px; background:var(--cream); display:flex; align-items:center;
    justify-content:center; font-size:32px; color:#aaa; flex-shrink:0;
  }
  .stu-info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; flex:1; min-width:220px; }
  .stu-field { font-size:13px; }
  .stu-field .lbl { color:#999; font-size:11px; display:block; margin-bottom:2px; }
  .stu-field .val { font-weight:700; color:var(--ink); }
  .stu-stats-row { display:flex; gap:10px; padding:0 24px 16px; flex-wrap:wrap; }
  .stu-stat-card {
    flex:1; min-width:100px; background:var(--cream); border-radius:10px; padding:10px 14px; text-align:center;
  }
  .stu-stat-card .num { font-size:20px; font-weight:900; color:var(--ink); }
  .stu-stat-card .lbl { font-size:11px; color:#777; margin-top:2px; }
  .stu-log-title { padding:0 24px; font-size:13px; font-weight:700; color:#777; margin-bottom:6px; }
  .stu-log-wrap { max-height:260px; overflow-y:auto; padding:0 24px 22px; }
  .row-clickable { cursor:pointer; }
  .row-clickable:hover td { background:#f3f1e9 !important; }

  /* ===== متابعة رعوية ===== */
  .pastoral-card {
    background:#fff; border:1px solid var(--cream); border-right:4px solid var(--accent);
    border-radius:10px; padding:14px 18px; margin-bottom:10px; display:flex; justify-content:space-between;
    align-items:center; gap:12px; flex-wrap:wrap; cursor:pointer; transition:box-shadow .15s;
  }
  .pastoral-card:hover { box-shadow:0 4px 14px var(--shadow); }
  .pastoral-card .name { font-weight:900; font-size:14.5px; }
  .pastoral-card .sub { font-size:12px; color:#999; margin-top:2px; }
  .pastoral-pct { font-size:18px; font-weight:900; color:var(--accent); }

  /* ===== نتائج البحث الشامل ===== */
  .gsearch-result {
    background:#fff; border:1px solid var(--cream); border-radius:10px; padding:12px 16px;
    margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;
    flex-wrap:wrap; gap:8px;
  }
  .gsearch-result:hover { background:#faf8f3; }
  .gsearch-result .name { font-weight:900; font-size:14px; }
  .gsearch-result .cls { font-size:12px; color:#999; }

  /* ===== توافق الهاتف: منع خروج العناصر عن عرض الشاشة ===== */
  .header-brand, .header-brand > div:last-child, .detail-head > div:first-child { min-width:0; }
  .header h1, .detail-head h2 { overflow-wrap:anywhere; }
  .header-actions, .detail-head > div[style*="display:flex"] { flex-wrap:wrap; }
  .tabs { overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; }
  .tab-btn { white-space:nowrap; flex-shrink:0; }

  @media (max-width: 768px) {
    .header { padding:12px 14px; }
    .header h1 { font-size:15px; }
    .header-brand { width:100%; }
    .header-actions { width:100%; gap:6px; }
    .header-actions .btn { flex:1 1 calc(50% - 6px); padding:8px 6px; font-size:12px; text-align:center; justify-content:center; }
    .container { padding:14px 12px 50px; }
    .toolbar { gap:8px; }
    .search-box { min-width:0; width:100%; flex:1 1 100%; }
    .summary-pill { width:100%; text-align:center; }
    .class-grid { grid-template-columns:1fr; }

    #detailOverlay, #studentOverlay { padding:10px 8px; }
    .detail-head { padding:14px; }
    .detail-head > div[style*="display:flex"] { width:100%; }
    .detail-head .btn { flex:1 1 auto; padding:8px 10px; font-size:12px; }
    .tabs { padding:10px 10px 0; }
    .tab-btn { padding:9px 12px; font-size:13px; }
    .tab-panel { padding:14px 10px 20px; }

    /* الجداول: تمرير أفقي داخل الجدول بدل توسيع الصفحة */
    table.data-table, .chapters-table { display:block; max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table.data-table th, table.data-table td { padding:8px 8px; }
    .chapters-table th, .chapters-table td { padding:9px 8px; font-size:12.5px; }

    .stu-row { padding:14px; gap:12px; }
    .stu-info-grid { min-width:0; width:100%; }
    .stu-stats-row { padding:0 14px 14px; }
    .stu-stat-card { min-width:80px; padding:8px; }
    .stu-log-title { padding:0 14px; }
    .stu-log-wrap { padding:0 14px 18px; }

    .login-card { padding:28px 20px 24px; }
    .chapter-edit-modal { padding:16px; }
    .toast { max-width:92vw; text-align:center; }
  }

  @media (max-width: 400px) {
    .header-actions .btn { flex:1 1 100%; }
    .stu-info-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<!-- ===== شاشة تسجيل الدخول ===== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="seal">🕊️</div>
    <div class="login-title">لوحة المشرفين</div>
    <div class="login-sub">كاتدرائية رئيس الملائكة الجليل ميخائيل — طنطا</div>
    <div class="login-error" id="loginError"></div>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">دخول</button>
    <div class="login-note">هذه الصفحة مخصصة للمشرفين فقط.<br>يتم إنشاء حسابات المشرفين يدويًا من لوحة Supabase.</div>
  </div>
</div>

<!-- ===== لوحة الإدارة ===== -->
<div id="dashScreen">
  <div class="header">
    <div class="header-brand">
      <div class="header-icon">🔒</div>
      <div>
        <h1>لوحة المشرفين — متابعة الفصول</h1>
        <div class="header-subtitle" id="userEmailLabel"></div>
      </div>
    </div>
    <div class="header-actions">
      <a href="./index.html" class="btn btn-outline" title="الانتقال إلى صفحة كشف الغياب" style="text-decoration:none;display:inline-flex;align-items:center;">📋 كشف الغياب</a>
      <button class="btn btn-outline" id="navClasses" onclick="showView('classes')">📚 الفصول</button>
      <button class="btn btn-outline" id="navPastoral" onclick="showView('pastoral')">💙 متابعة رعوية</button>
      <button class="btn btn-outline" id="navChapters" onclick="showView('chapters')">🗂️ إدارة الفصول</button>
      <button class="btn btn-outline" id="navServants" onclick="showView('servants')">🧑‍🤝‍🧑 قائمة الخدام</button>
      <button class="btn btn-outline" id="navAnnouncements" onclick="showView('announcements')">📢 الإعلانات</button>
      <button class="btn btn-outline" id="navReasons" onclick="showView('reasons')">📊 أسباب الغياب</button>
      <button class="btn btn-outline" id="navDups" onclick="showView('dups')">🧬 المتكررون</button>
      <button class="btn btn-outline" id="navPromotion" onclick="showView('promotion')">🎓 الترقية السنوية</button>
      <button class="btn btn-outline" id="navSecurity" onclick="showView('security')">🛡️ التحذيرات الأمنية<span id="securityBadge" style="display:none;background:var(--accent,#c8392b);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-right:6px;"></span></button>
      <button class="btn btn-outline" onclick="loadAllClasses()">⟳ تحديث</button>
      <button class="btn btn-outline" data-ar-toggle></button>
      <button class="btn btn-red" onclick="deleteAllClasses()">🗑️ حذف كل الفصول</button>
      <button class="btn btn-red" onclick="doLogout()">خروج</button>
    </div>
  </div>

<script>
  // ================== إعدادات الاتصال بالسحابة ==================
  const SUPABASE_URL      = 'https://tnpokrdrhactzjrhlyjv.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRucG9rcmRyaGFjdHpqcmhseWp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMTg4MDYsImV4cCI6MjEwNjc5NDgwNn0.GAR0ckTxCGwHg4LeR1GAU5CTXnDLLpQkuY2lL6BycBw';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allClasses = [];
  let currentDetailClass = null;

  // ================== تسجيل الدخول ==================
  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    const errBox = document.getElementById('loginError');
    errBox.style.display = 'none';

    if (!email || !password) {
      errBox.textContent = 'من فضلك أدخل البريد الإلكتروني وكلمة المرور.';
      errBox.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spin"></span> جاري الدخول...';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    btn.disabled = false;
    btn.textContent = 'دخول';

    if (error) {
      errBox.textContent = 'فشل الدخول: البريد أو كلمة المرور غير صحيحة.';
      errBox.style.display = 'block';
      return;
    }

    showDashboard(data.user);
  }

  async function doLogout() {
    await sb.auth.signOut();
    document.getElementById('dashScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    window._adminEmail = '';
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPassword').value = '';
  }

  // إجبار المشرف على تغيير كلمة المرور المؤقتة عند أول دخول
  async function enforcePasswordChange() {
    const { data: needs } = await sb.rpc('admin_needs_password_change');
    if (!needs) return true;
    alert('هذا أول دخول بكلمة المرور المؤقتة. يجب اختيار كلمة مرور جديدة الآن.');
    while (true) {
      const p1 = prompt('أدخل كلمة المرور الجديدة (8 أحرف على الأقل):');
      if (p1 === null) { await doLogout(); return false; }
      if (p1.length < 8) { alert('كلمة المرور قصيرة (8 أحرف على الأقل).'); continue; }
      const p2 = prompt('أعد كتابة كلمة المرور الجديدة للتأكيد:');
      if (p2 === null) { await doLogout(); return false; }
      if (p1 !== p2) { alert('الكلمتان غير متطابقتين، حاول مرة أخرى.'); continue; }
      const { error } = await sb.auth.updateUser({ password: p1 });
      if (error) { alert('تعذر تغيير كلمة المرور: ' + error.message); continue; }
      await sb.rpc('admin_password_changed');
      showToast('✅ تم تغيير كلمة المرور');
      return true;
    }
  }

  async function showDashboard(user) {
    if (!(await enforcePasswordChange())) return;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashScreen').style.display = 'block';
    document.getElementById('userEmailLabel').textContent = 'مسجل الدخول: ' + (user.email || '');
    window._adminEmail = user.email || '';
    showView('classes');
    loadAllClasses();
    refreshSecurityBadge();
    promoAutoTick();
  }

  // عند فتح الصفحة، تحقق هل يوجد جلسة دخول محفوظة
  (async () => {
    const { data } = await sb.auth.getSession();
    if (data && data.session && data.session.user) {
      showDashboard(data.session.user);
    }
  })();

  document.getElementById('loginPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  // ================== تحميل بيانات كل الفصول ==================
  async function loadAllClasses() {
    document.getElementById('classGridWrap').innerHTML =
      '<div class="empty-state"><div class="ic">⏳</div>جاري تحميل الفصول من السحابة...</div>';

    const { data, error } = await sb
      .from('class_records')
      .select('class_id, class_name, data, updated_at')
      .order('updated_at', { ascending: false });

    if (error) {
      document.getElementById('classGridWrap').innerHTML =
        '<div class="empty-state"><div class="ic">⚠️</div>تعذر تحميل البيانات: ' + error.message + '</div>';
      return;
    }

    allClasses = data || [];
    renderClassGrid();
  }

  function renderClassGrid() {
    const q = (document.getElementById('searchBox').value || '').trim().toLowerCase();
    const filtered = allClasses.filter(c => (c.class_name || '').toLowerCase().includes(q));

    const totalStudents = allClasses.reduce((sum, c) => sum + ((c.data && c.data.students) || []).length, 0);
    const totalServants = allClasses.reduce((sum, c) => sum + ((c.data && c.data.servants) || []).length, 0);
    document.getElementById('summaryPill').textContent =
      `📚 ${allClasses.length} فصل  •  👦 ${totalStudents} مخدوم  •  🧑‍🤝‍🧑 ${totalServants} خادم`;

    const wrap = document.getElementById('classGridWrap');
    if (!filtered.length) {
      wrap.innerHTML = '<div class="empty-state"><div class="ic">📭</div>لا توجد فصول مطابقة بعد.</div>';
      return;
    }

    wrap.innerHTML = '<div class="class-grid">' + filtered.map(c => {
      const d = c.data || {};
      const studentsCount = (d.students || []).length;
      const servantsCount = (d.servants || []).length;
      const updated = c.updated_at ? new Date(c.updated_at).toLocaleString('ar-EG') : '—';
      return `
        <div class="class-card" onclick="openDetail('${c.class_id}')">
          <h3>${escapeHtml(c.class_name || 'بدون اسم')}</h3>
          <div class="meta">آخر تحديث: ${updated}</div>
          <div class="stats">
            <span class="chip green">👦 ${studentsCount} مخدوم</span>
            <span class="chip blue">🧑‍🤝‍🧑 ${servantsCount} خادم</span>
          </div>
        </div>`;
    }).join('') + '</div>';
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ================== تفاصيل فصل معيّن ==================
  function openDetail(classId) {
    const cls = allClasses.find(c => c.class_id === classId);
    if (!cls) return;
    currentDetailClass = cls;

    const d = cls.data || {};
    document.getElementById('detailTitle').textContent = cls.class_name || 'بدون اسم';
    document.getElementById('detailMeta').textContent =
      'آخر تحديث: ' + (cls.updated_at ? new Date(cls.updated_at).toLocaleString('ar-EG') : '—') +
      '  •  معرف الفصل: ' + cls.class_id;

    renderStudentsPanel(d);
    renderServantsPanel(d);
    renderAttendancePanel(d);

    switchTab('students');
    document.getElementById('detailOverlay').style.display = 'flex';
  }

  function closeDetail() {
    document.getElementById('detailOverlay').style.display = 'none';
    currentDetailClass = null;
  }

  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
  }

  function computeAttendancePct(studentId, attendance) {
    let total = 0, present = 0;
    Object.keys(attendance || {}).forEach(date => {
      const st = attendance[date][studentId];
      if (st) { total++; if (st === 'present') present++; }
    });
    if (!total) return null;
    return Math.round((present / total) * 100);
  }

  function renderStudentsPanel(d) {
    const students = d.students || [];
    const confessions = d.confessions || {};
    const attendance = d.attendance || {};
    const panel = document.getElementById('panel-students');

    if (!students.length) {
      panel.innerHTML = '<div class="no-data">لا يوجد مخدومون مسجّلون في هذا الفصل.</div>';
      return;
    }

    panel.innerHTML = `
      <table class="data-table">
        <thead><tr>
          <th>#</th><th>الاسم</th><th>تاريخ الميلاد</th><th>أب الاعتراف</th>
          <th>مرات الاعتراف</th><th>نسبة الحضور</th><th>هاتف</th><th></th>
        </tr></thead>
        <tbody>
          ${students.map((s, i) => {
            const pct = computeAttendancePct(s.id, attendance);
            const pctHtml = pct === null ? '—' :
              `${pct}% <span class="pct-bar"><span class="pct-fill" style="width:${pct}%"></span></span>`;
            const phone = s.phone || s.phone2 || s.ownPhone || '—';
            return `<tr class="row-clickable" onclick="openStudentModal('${s.id}')">
              <td>${i+1}</td>
              <td style="font-weight:700;">${escapeHtml(s.name || '')}</td>
              <td>${escapeHtml(s.dob || '—')}</td>
              <td>${escapeHtml(s.confessor || '—')}</td>
              <td>${confessions[s.id] || 0}</td>
              <td>${pctHtml}</td>
              <td>${escapeHtml(phone)}</td>
              <td><button class="sv-edit" title="حذف المخدوم" style="color:var(--accent);" onclick="event.stopPropagation(); deleteStudentAdmin('${s.id}')">🗑️</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div class="no-data" style="padding-top:10px;">👆 دوس على أي مخدوم لعرض بروفايله الكامل</div>`;
  }

  function renderServantsPanel(d) {
    const servants = d.servants || [];
    const panel = document.getElementById('panel-servants');
    if (!servants.length) {
      panel.innerHTML = '<div class="no-data">لا يوجد خدام مسجّلون في هذا الفصل.</div>';
      return;
    }
    panel.innerHTML = `
      <table class="data-table">
        <thead><tr><th>#</th><th>الاسم</th><th>الدور</th><th>هاتف</th><th></th></tr></thead>
        <tbody>
          ${servants.map((s, i) => `
            <tr>
              <td>${i+1}</td>
              <td style="font-weight:700;">${escapeHtml(s.name || '')}</td>
              <td>${escapeHtml(s.role || s.job || '—')}</td>
              <td>${escapeHtml(s.phone || '—')}</td>
              <td><button class="sv-edit" title="حذف الخادم" style="color:var(--accent);" onclick="deleteServantAdmin('${escapeHtml(String(s.sid))}')">🗑️</button></td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }

  function renderAttendancePanel(d) {
    const attendance = d.attendance || {};
    const students = d.students || [];
    const dates = Object.keys(attendance).sort().reverse();
    const panel = document.getElementById('panel-attendance');

    if (!dates.length) {
      panel.innerHTML = '<div class="no-data">لا يوجد سجل حضور بعد.</div>';
      return;
    }

    panel.innerHTML = `
      <table class="data-table">
        <thead><tr><th>التاريخ</th><th>حاضر</th><th>غائب</th><th>متأخر</th><th>الإجمالي</th></tr></thead>
        <tbody>
          ${dates.map(date => {
            const rec = attendance[date] || {};
            let present=0, absent=0, late=0;
            Object.values(rec).forEach(st => {
              if (st === 'present') present++;
              else if (st === 'absent') absent++;
              else if (st === 'late') late++;
            });
            return `<tr>
              <td style="font-weight:700;">${date}</td>
              <td style="color:var(--green);font-weight:700;">${present}</td>
              <td style="color:var(--accent);font-weight:700;">${absent}</td>
              <td style="color:var(--gold);font-weight:700;">${late}</td>
              <td>${present+absent+late}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  function exportCurrentClassJSON() {
    if (!currentDetailClass) return;
    const blob = new Blob([JSON.stringify(currentDetailClass.data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `بيانات_${(currentDetailClass.class_name || 'فصل').replace(/\s/g,'_')}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ================== حذف فصل ==================
  async function deleteCurrentClass() {
    if (!currentDetailClass) return;
    const name = currentDetailClass.class_name || 'بدون اسم';
    const typed = prompt(
      `⚠️ هذا الإجراء نهائي ولا يمكن التراجع عنه.\n\nسيتم حذف كل بيانات فصل "${name}" (المخدومون، الخدام، الحضور) نهائيًا من السحابة.\n\nللتأكيد، اكتب اسم الفصل بالضبط:`
    );
    if (typed === null) return;
    if (typed.trim() !== name.trim()) {
      showToast('❌ الاسم المكتوب غير مطابق — لم يتم الحذف');
      return;
    }
    const { error } = await sb.from('class_records').delete().eq('class_id', currentDetailClass.class_id);
    if (error) {
      showToast('⚠️ فشل الحذف: ' + error.message);
      return;
    }
    allClasses = allClasses.filter(c => c.class_id !== currentDetailClass.class_id);
    closeDetail();
    renderClassGrid();
    showToast('🗑️ تم حذف الفصل "' + name + '" نهائيًا');
  }

  // ================== حذف كل الفصول ==================
  async function deleteAllClasses() {
    if (!allClasses.length) {
      showToast('لا توجد فصول لحذفها');
      return;
    }

    const email = prompt(
      `⚠️ إجراء خطير جدًا ونهائي ولا يمكن التراجع عنه.\n\nسيتم حذف كل الفصول (${allClasses.length} فصل) وكل بياناتها (المخدومون، الخدام، الحضور) نهائيًا من السحابة.\n\nللتأكيد، أدخل البريد الإلكتروني لحسابك (نفس بريد تسجيل الدخول):`
    );
    if (email === null) return;

    const password = prompt('أدخل كلمة المرور الخاصة بحسابك (نفس كلمة مرور تسجيل الدخول) للتأكيد النهائي:');
    if (password === null) return;

    if (!email.trim() || !password) {
      showToast('❌ يجب إدخال البريد وكلمة المرور — لم يتم الحذف');
      return;
    }

    const { data: sessionData } = await sb.auth.getSession();
    const currentEmail = sessionData && sessionData.session && sessionData.session.user
      ? sessionData.session.user.email
      : null;

    if (!currentEmail || email.trim().toLowerCase() !== currentEmail.toLowerCase()) {
      showToast('❌ البريد المدخل لا يطابق بريد الحساب المسجّل دخوله — لم يتم الحذف');
      return;
    }

    // إعادة التحقق الفعلي من كلمة المرور عبر Supabase قبل الحذف
    const { error: authError } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    if (authError) {
      showToast('❌ فشل التحقق: كلمة المرور غير صحيحة — لم يتم الحذف');
      return;
    }

    if (!confirm(`⚠️ تأكيد أخير: سيتم حذف كل الفصول الـ ${allClasses.length} نهائيًا. هل أنت متأكد تمامًا؟`)) {
      return;
    }

    const { error: delError } = await sb.from('class_records').delete().not('class_id', 'is', null);
    if (delError) {
      showToast('⚠️ فشل الحذف: ' + delError.message);
      return;
    }

    allClasses = [];
    renderClassGrid();
    closeDetail();
    showToast('🗑️ تم حذف كل الفصول نهائيًا');
  }

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  // ================== إدارة الفصول وكلمات سرها (عبر دوال تتحقق من جلسة المشرف في القاعدة) ==================
  let chaptersAdminCache = [];
  let editingChapterId = null;
  const _safeId = id => /^[A-Za-z0-9_\-]+$/.test(String(id || '')) ? String(id) : '';

  async function loadChaptersAdmin() {
    const wrap = document.getElementById('chaptersView');
    wrap.innerHTML = '<div class="empty-state"><div class="ic">⏳</div>جاري تحميل الفصول...</div>';
    const { data, error } = await sb.rpc('admin_list_chapters');
    if (error) {
      wrap.innerHTML = '<div class="empty-state"><div class="ic">⚠️</div>تعذر تحميل الفصول: ' + escapeHtml(error.message) + '<br><small>تأكد من تشغيل ملف cloud_policy.sql وإضافة حسابك لقائمة المشرفين.</small></div>';
      return;
    }
    chaptersAdminCache = data || [];
    renderChaptersAdmin();
  }

  function renderChaptersAdmin() {
    const wrap = document.getElementById('chaptersView');
    if (!chaptersAdminCache.length) {
      wrap.innerHTML = '<div class="empty-state"><div class="ic">📭</div>لا توجد فصول بعد. تُنشأ الفصول من صفحة كشف الغياب.</div>';
      return;
    }
    wrap.innerHTML = '<table class="chapters-table"><thead><tr><th>الفصل</th><th>آخر تحديث</th><th></th></tr></thead><tbody>' +
      chaptersAdminCache.map(c => {
        const id = _safeId(c.chapter_id);
        if (!id) return '';
        const upd = c.updated_at ? new Date(c.updated_at).toLocaleString('ar-EG') : '—';
        return `<tr>
          <td>${escapeHtml(c.icon || '📂')} ${escapeHtml(c.chapter_name || 'بدون اسم')}</td>
          <td>${upd}</td>
          <td class="actions">
            <button class="btn btn-gold" onclick="openChapterEdit('${id}')">✏️ تعديل</button>
            <button class="btn btn-red" onclick="deleteChapterAdmin('${id}')">🗑️ حذف</button>
          </td></tr>`;
      }).join('') + '</tbody></table>';
  }

  function openChapterEdit(id) {
    const c = chaptersAdminCache.find(x => x.chapter_id === id);
    if (!c) return;
    editingChapterId = id;
    document.getElementById('chapterEditName').value = c.chapter_name || '';
    document.getElementById('chapterEditIcon').value = c.icon || '📂';
    document.getElementById('chapterEditPass').value = '';
    document.getElementById('chapterEditErr').style.display = 'none';
    document.getElementById('chapterEditOverlay').classList.add('active');
  }
  function closeChapterEdit() {
    document.getElementById('chapterEditOverlay').classList.remove('active');
    editingChapterId = null;
  }

  async function saveChapterEdit() {
    const errEl = document.getElementById('chapterEditErr');
    errEl.style.display = 'none';
    const name = document.getElementById('chapterEditName').value.trim();
    const icon = document.getElementById('chapterEditIcon').value.trim() || '📂';
    const pass = document.getElementById('chapterEditPass').value;
    if (!name) { errEl.textContent = 'اكتب اسم الفصل.'; errEl.style.display = 'block'; return; }
    if (pass && pass.length < 4) { errEl.textContent = 'كلمة السر يجب ألا تقل عن 4 أحرف.'; errEl.style.display = 'block'; return; }
    const btn = document.getElementById('chapterEditSaveBtn');
    btn.disabled = true;
    const { data, error } = await sb.rpc('admin_update_chapter', {
      p_chapter_id: editingChapterId, p_new_name: name, p_icon: icon, p_new_password: pass || null
    });
    btn.disabled = false;
    if (error || data === false) {
      errEl.textContent = '⚠️ تعذر الحفظ' + (error ? ': ' + error.message : ' (غير مصرّح)');
      errEl.style.display = 'block';
      return;
    }
    closeChapterEdit();
    showToast('✅ تم تحديث الفصل');
    loadChaptersAdmin();
  }

  async function deleteChapterAdmin(id) {
    const c = chaptersAdminCache.find(x => x.chapter_id === id);
    if (!c) return;
    if (!confirm('⚠️ سيتم حذف فصل "' + (c.chapter_name || '') + '" وكل بياناته نهائياً ولا يمكن التراجع.\n\nهل أنت متأكد؟')) return;
    const { data, error } = await sb.rpc('admin_delete_chapter', { p_chapter_id: id });
    if (error || data === false) { showToast('⚠️ تعذر الحذف' + (error ? ': ' + error.message : '')); return; }
    showToast('🗑️ تم حذف الفصل');
    await loadChaptersAdmin();
    loadAllClasses();
  }

  // ================== التحذيرات الأمنية (محاولات تخمين كلمة سر الفصول) ==================
  let securityEventsCache = [];

  async function refreshSecurityBadge() {
    try {
      const { data, error } = await sb.rpc('admin_list_security_events');
      if (error) return;
      const list = data || [];
      const unseen = list.filter(e => e.event_type === 'banned' && !e.acknowledged).length;
      const badge = document.getElementById('securityBadge');
      if (badge) {
        if (unseen > 0) { badge.textContent = unseen; badge.style.display = 'inline-block'; }
        else badge.style.display = 'none';
      }
    } catch (e) { /* صامت */ }
  }

  async function loadSecurityEvents() {
    const wrap = document.getElementById('securityView');
    wrap.innerHTML = '<div class="empty-state"><div class="ic">⏳</div>جاري تحميل التحذيرات الأمنية...</div>';
    const { data, error } = await sb.rpc('admin_list_security_events');
    if (error) {
      wrap.innerHTML = '<div class="empty-state"><div class="ic">⚠️</div>تعذر تحميل التحذيرات: ' + escapeHtml(error.message) +
        '<br><small>تأكد من تطبيق ملف SQL الخاص بحماية كلمة سر الفصول (chapter_security_locks / admin_list_security_events).</small></div>';
      return;
    }
    securityEventsCache = data || [];
    renderSecurityEvents();
    refreshSecurityBadge();
  }

  function renderSecurityEvents() {
    const wrap = document.getElementById('securityView');
    if (!securityEventsCache.length) {
      wrap.innerHTML = '<div class="empty-state"><div class="ic">✅</div>لا توجد تحذيرات أمنية حالياً — لا يوجد محاولات تخمين مشبوهة لكلمات سر الفصول.</div>';
      return;
    }
    const typeLabel = { banned: '⛔ منع نهائي', locked: '🔒 قفل مؤقت (15 دقيقة)', unbanned_by_admin: '✅ رفع المنع (بواسطة مشرف)' };
    wrap.innerHTML = '<div class="toolbar"><span class="summary-pill">' + securityEventsCache.length + ' حدث أمني</span></div>' +
      '<table class="data-table"><thead><tr><th>النوع</th><th>الفصل</th><th>معرّف الجهاز</th><th>عنوان IP</th><th>الجهاز / المتصفح</th><th>الوقت</th><th></th></tr></thead><tbody>' +
      securityEventsCache.map(ev => {
        const chapter = (chaptersAdminCache.find(c => c.chapter_id === ev.chapter_id) || {}).chapter_name || ev.chapter_id;
        const when = ev.created_at ? new Date(ev.created_at).toLocaleString('ar-EG') : '—';
        const canUnban = ev.event_type === 'banned' && !ev.acknowledged;
        return '<tr>' +
          '<td>' + escapeHtml(typeLabel[ev.event_type] || ev.event_type) + '</td>' +
          '<td>' + escapeHtml(chapter) + '</td>' +
          '<td style="font-size:11px;color:#888;">' + escapeHtml(ev.device_id || '—') + '</td>' +
          '<td>' + escapeHtml(ev.ip || '—') + '</td>' +
          '<td style="font-size:11px;">' + escapeHtml(ev.user_agent || '—') + '</td>' +
          '<td>' + when + '</td>' +
          '<td>' + (canUnban ? '<button class="btn btn-gold" onclick="unbanChapterDevice(\'' + escapeHtml(String(ev.chapter_id)) + '\',\'' + escapeHtml(String(ev.device_id)) + '\')">✅ رفع المنع</button>' : '') + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table>';
  }

  async function unbanChapterDevice(chapterId, deviceId) {
    if (!confirm('هل تريد رفع المنع عن هذا الجهاز للسماح له بمحاولة الدخول للفصل مرة أخرى؟')) return;
    const { data, error } = await sb.rpc('admin_unban_chapter_device', { p_chapter_id: chapterId, p_device_id: deviceId });
    if (error || data === false) { showToast('⚠️ تعذر رفع المنع' + (error ? ': ' + error.message : '')); return; }
    showToast('✅ تم رفع المنع عن الجهاز');
    loadSecurityEvents();
  }

  // ================== 🎓 الترقية السنوية للفصول ==================
  // تنقل "مرحلة الفصل" فقط (بمخدوميه). الخدام لا يُنقلون: كل خادم يبقى على المرحلة التي اختارها في الصفحة الرئيسية.
  const PROMO_ORDER = ['nursery','kg1','kg2','p1','p2','p3','p4','p5','p6','e1','e2','e3','s1','s2','s3','u1','u2','u3','u4','u5','grad','youth'];
  const PROMO_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  let promoState = null;

  function promoStageName(id) { return (typeof STAGE_NAMES !== 'undefined' && STAGE_NAMES[id]) || id; }
  function promoFmtDate(d) {
    if (!d) return '—';
    const x = new Date(String(d).length <= 10 ? d + 'T00:00:00' : d);
    return isNaN(x) ? String(d) : x.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  async function loadPromotionAdmin() {
    const wrap = document.getElementById('promotionView');
    wrap.innerHTML = '<div class="empty-state"><div class="ic">⏳</div>جاري تحميل إعدادات الترقية...</div>';
    const { data, error } = await sb.rpc('admin_get_promotion');
    if (error || !data) {
      const missing = error && (error.code === 'PGRST202' || error.code === '42883' || /could not find|does not exist|schema cache/i.test(error.message || ''));
      wrap.innerHTML = '<div class="empty-state"><div class="ic">⚠️</div>' +
        (missing ? 'شغّل ملف promotion_setup.sql على Supabase أولًا.' : 'تعذر تحميل الإعدادات: ' + escapeHtml((error && error.message) || '')) + '</div>';
      return;
    }
    promoState = data;
    renderPromotionAdmin();
  }

  function renderPromotionAdmin() {
    const s = promoState || {};
    const map = s.stage_map || {};
    const wrap = document.getElementById('promotionView');
    const opts = sel => '<option value="">— بدون ترقية (تبقى كما هي) —</option>' +
      PROMO_ORDER.map(id => '<option value="' + id + '"' + (sel === id ? ' selected' : '') + '>' + escapeHtml(promoStageName(id)) + '</option>').join('');
    const dayOpts = Array.from({ length: 31 }, (_, i) => '<option value="' + (i + 1) + '"' + ((s.promo_day || 1) === i + 1 ? ' selected' : '') + '>' + (i + 1) + '</option>').join('');
    const monOpts = PROMO_MONTHS.map((m, i) => '<option value="' + (i + 1) + '"' + ((s.promo_month || 9) === i + 1 ? ' selected' : '') + '>' + m + '</option>').join('');

    let last = '<span style="color:#888">لم تتم أي ترقية بعد.</span>';
    const ls = s.last_run_summary;
    if (ls && ls.ran) {
      const rows = Object.keys(ls.moved || {}).map(k => {
        const [f, t] = k.split('>');
        return '<li>' + escapeHtml(promoStageName(f)) + ' ← ' + escapeHtml(promoStageName(t)) + ': <b>' + ls.moved[k] + '</b> فصل</li>';
      }).join('');
      last = '<div>آخر ترقية: <b>' + promoFmtDate(ls.at) + '</b> — إجمالي الفصول المنقولة: <b>' + (ls.total || 0) + '</b></div>' +
             (rows ? '<ul style="margin:6px 18px 0;padding:0;line-height:1.9">' + rows + '</ul>' : '');
    }

    wrap.innerHTML =
      '<div style="background:#fff;border-radius:12px;padding:18px 20px;line-height:1.9">' +
        '<h3 style="margin:0 0 8px">🎓 الترقية السنوية للفصول</h3>' +
        '<div style="font-size:13px;color:#555;margin-bottom:14px">في اليوم الذي تحدده من كل سنة تنتقل كل الفصول إلى المرحلة التالية دفعة واحدة (حضانة ← KG1 ← KG2 ← أولى ابتدائي ← ثانية ابتدائي ...). ' +
        '<b>الخدام لا يُنقلون</b>: كل خادم يبقى على المرحلة التي اختارها في الصفحة الرئيسية ويرى الفصول التي صارت في مرحلته.</div>' +
        '<label style="display:flex;gap:8px;align-items:center;font-weight:700;margin-bottom:12px"><input type="checkbox" id="promoEnabled"' + (s.enabled ? ' checked' : '') + '> تفعيل الترقية السنوية التلقائية</label>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px"><b>يوم الترقية كل سنة:</b>' +
          '<select id="promoDay" class="search-box" style="flex:0 0 auto;min-width:80px">' + dayOpts + '</select>' +
          '<select id="promoMonth" class="search-box" style="flex:0 0 auto;min-width:130px">' + monOpts + '</select></div>' +
        '<div style="font-size:13px;margin-bottom:6px">الترقية القادمة: <b>' + promoFmtDate(s.next_run) + '</b>' + (s.enabled ? '' : ' <span style="color:#c8392b">(غير مفعّلة)</span>') + '</div>' +
        '<div style="font-size:13px;margin-bottom:14px">' + last + '</div>' +
        '<details style="margin-bottom:14px"><summary style="cursor:pointer;font-weight:700">⚙️ مسار الترقية (يمكنك تعديل وجهة كل مرحلة)</summary>' +
          '<table class="chapters-table" style="margin-top:8px"><thead><tr><th>مرحلة الفصل الحالية</th><th>تنتقل إلى</th></tr></thead><tbody>' +
          PROMO_ORDER.map(id => '<tr><td>' + escapeHtml(promoStageName(id)) + '</td><td><select id="promoMap_' + id + '" class="search-box" style="min-width:200px">' + opts(map[id] || '') + '</select></td></tr>').join('') +
          '</tbody></table></details>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<button class="btn btn-blue" id="promoSaveBtn" onclick="savePromotion()">💾 حفظ الإعدادات</button>' +
          '<button class="btn btn-red" id="promoRunBtn" onclick="runPromotionNow()">▶️ تنفيذ الترقية الآن</button>' +
        '</div>' +
      '</div>';
  }

  function _promoCollect() {
    const map = {};
    PROMO_ORDER.forEach(id => { const el = document.getElementById('promoMap_' + id); map[id] = el ? el.value : ''; });
    return {
      p_enabled: document.getElementById('promoEnabled').checked,
      p_month: parseInt(document.getElementById('promoMonth').value, 10),
      p_day: parseInt(document.getElementById('promoDay').value, 10),
      p_map: map
    };
  }

  async function savePromotion() {
    const btn = document.getElementById('promoSaveBtn');
    btn.disabled = true;
    const { error } = await sb.rpc('admin_set_promotion', _promoCollect());
    btn.disabled = false;
    if (error) { showToast('⚠️ تعذر الحفظ: ' + error.message); return; }
    showToast('✅ تم حفظ إعدادات الترقية');
    loadPromotionAdmin();
  }

  async function runPromotionNow() {
    if (!confirm('🎓 سيتم نقل كل الفصول الآن إلى المرحلة التالية حسب مسار الترقية.\n\nالخدام لن يتأثروا. لا يمكن التراجع تلقائيًا.\n\nهل أنت متأكد؟')) return;
    if (!confirm('⚠️ تأكيد أخير: تنفيذ الترقية الآن؟')) return;
    const btn = document.getElementById('promoRunBtn');
    btn.disabled = true;
    // نحفظ ما ظهر على الشاشة أولًا حتى يُنفَّذ المسار المعروض أمامك
    const saved = await sb.rpc('admin_set_promotion', _promoCollect());
    if (saved.error) { btn.disabled = false; showToast('⚠️ تعذر حفظ المسار: ' + saved.error.message); return; }
    const { data, error } = await sb.rpc('admin_run_promotion', { p_force: true });
    btn.disabled = false;
    if (error) { showToast('⚠️ تعذر تنفيذ الترقية: ' + error.message); return; }
    showToast('🎓 تمت الترقية — ' + ((data && data.total) || 0) + ' فصل');
    loadPromotionAdmin();
    loadAllClasses();
  }

  // عند دخول أي مشرف: لو حان موعد الترقية ولم تُنفَّذ (مثلًا لم تُفعَّل الجدولة اليومية) تُنفَّذ الآن
  async function promoAutoTick() {
    try {
      const { data, error } = await sb.rpc('admin_run_promotion', { p_force: false });
      if (!error && data && data.ran) { showToast('🎓 تمت الترقية السنوية للفصول (' + (data.total || 0) + ' فصل)'); loadAllClasses(); }
    } catch (e) { /* ملف promotion_setup.sql لم يُشغَّل بعد — نتجاهل بصمت */ }
  }

  // ================== قائمة الخدام المسجّلين (الاسم + الفصل + الهاتف) ==================
  const STAGE_NAMES = {
    nursery:'حضانة', kg1:'KG1 (روضة أولى)', kg2:'KG2 (روضة ثانية)',
    p1:'الأول الابتدائي', p2:'الثاني الابتدائي', p3:'الثالث الابتدائي', p4:'الرابع الابتدائي', p5:'الخامس الابتدائي', p6:'السادس الابتدائي',
    e1:'الأول الإعدادي', e2:'الثاني الإعدادي', e3:'الثالث الإعدادي',
    s1:'الأول الثانوي', s2:'الثاني الثانوي', s3:'الثالث الثانوي',
    u1:'الفرقة الأولى (جامعة)', u2:'الفرقة الثانية (جامعة)', u3:'الفرقة الثالثة (جامعة)', u4:'الفرقة الرابعة (جامعة)', u5:'الفرقة الخامسة فأعلى (جامعة)',
    grad:'اجتماع شباب(بيك هنقدر)', youth:'خريجين'
  };
  // الصفات: خادم / أمين مساعد / أمين خدمة (ملف servant_roles.sql) — الأمينان يريان كل فصول مرحلتهما لفئتهما ويعدّلان فصلهما فقط
  const GROUP_NAMES = { kg:'الحضانة ورياض الأطفال', prim:'المرحلة الابتدائية', prep:'المرحلة الإعدادية', sec:'المرحلة الثانوية', uni:'المرحلة الجامعية', grad:'الشباب والخريجين' };
  const STAGE_TO_GROUP = { nursery:'kg', kg1:'kg', kg2:'kg', p1:'prim', p2:'prim', p3:'prim', p4:'prim', p5:'prim', p6:'prim', e1:'prep', e2:'prep', e3:'prep',
    s1:'sec', s2:'sec', s3:'sec', u1:'uni', u2:'uni', u3:'uni', u4:'uni', u5:'uni', grad:'grad', youth:'grad' };
  const ROLE_NAMES = { servant:'خادم', assistant:'أمين مساعد', coordinator:'أمين خدمة' };
  let rolesAvail = false;
  const isSecRole = s => !!s && (s.role_type === 'assistant' || s.role_type === 'coordinator') && !!GROUP_NAMES[s.stage_group];
  let allServants = [];

  async function loadServantsAdmin() {
    const wrap = document.getElementById('servantsView');
    wrap.innerHTML = '<div class="empty-state"><div class="ic">⏳</div>جاري تحميل الخدام...</div>';
    const { data, error } = await sb.rpc('admin_list_servants_phone');
    if (error) {
      const missing = error.code === 'PGRST202' || error.code === '42883' || /could not find|does not exist|schema cache/i.test(error.message || '');
      wrap.innerHTML = '<div class="empty-state"><div class="ic">⚠️</div>' +
        (missing ? 'شغّل ملف servant_phone.sql على Supabase أولاً.' : 'تعذر تحميل الخدام: ' + escapeHtml(error.message || '')) + '</div>';
      return;
    }
    allServants = data || [];
    try {      // أسماء الفصول التابع لها الخدام (servant_class.sql)
      const rc = await sb.rpc('admin_list_servant_classes');
      if (!rc.error && Array.isArray(rc.data)) {
        const cm = {}; rc.data.forEach(x => { cm[x.device_id] = x.class_name || ''; });
        allServants.forEach(s => { s.class_name = cm[s.device_id] || ''; });
      }
    } catch (e) {}
    rolesAvail = false;
    try {      // الصفات (servant_roles.sql)
      const rr = await sb.rpc('admin_list_servant_roles');
      if (!rr.error && Array.isArray(rr.data)) {
        rolesAvail = true;
        const rm = {}; rr.data.forEach(x => { rm[x.device_id] = x; });
        allServants.forEach(s => {
          const x = rm[s.device_id];
          s.role_type = x && (x.role_type === 'assistant' || x.role_type === 'coordinator') ? x.role_type : 'servant';
          s.stage_group = s.role_type === 'servant' ? '' : ((x && x.stage_group) || '');
        });
      }
    } catch (e) {}
    renderServantsAdmin();
  }

  function renderServantsAdmin() {
    const wrap = document.getElementById('servantsView');
    const prev = document.getElementById('svSearch');
    const q = ((prev && prev.value) || '').trim().toLowerCase();
    const stageOf = id => STAGE_NAMES[id] || id || '—';
    const genderOf = g => g === 'girls' ? '👧 بنات' : '👦 بنين';

    const rows = allServants
      .map((s, i) => ({ s, i }))
      .filter(({ s }) => !q || (s.name + ' ' + stageOf(s.stage) + ' ' + genderOf(s.gender) + ' ' + (s.class_name || '') + ' ' + (s.phone || '') + ' ' + (isSecRole(s) ? ROLE_NAMES[s.role_type] + ' ' + GROUP_NAMES[s.stage_group] : '')).toLowerCase().includes(q));
    const noPhone = allServants.filter(s => !s.phone).length;

    let html = `<div class="sv-bar">
      <input type="text" class="search-box" id="svSearch" placeholder="🔍 ابحث بالاسم أو الفصل أو الهاتف..." value="${escapeHtml(prev ? prev.value : '')}" oninput="renderServantsAdmin(); const e=document.getElementById('svSearch'); e.focus(); e.setSelectionRange(e.value.length,e.value.length);">
      <span class="summary-pill">🧑‍🤝‍🧑 ${allServants.length} خادم${noPhone ? ' • 📵 ' + noPhone + ' بدون رقم' : ''}</span>
    </div>`;

    if (!rows.length) {
      html += '<div class="empty-state"><div class="ic">📭</div>' + (allServants.length ? 'لا توجد نتائج مطابقة.' : 'لا يوجد خدام مسجّلون بعد.') + '</div>';
    } else {
      html += `<div class="sv-wrap"><table class="data-table"><thead><tr>

  async function deleteRegisteredServant(i) {
    const s = allServants[i];
    if (!s) return;
    const nm = s.name || 'بدون اسم';
    if (!confirm('🗑️ حذف الخادم «' + nm + '» من قائمة الخدام المسجّلين؟\n\nسيُمسح تسجيله، ويُطلب منه إدخال بياناته من جديد عند فتح التطبيق على جهازه.')) return;
    const { data, error } = await sb.rpc('admin_delete_servant', { p_device: s.device_id });
    if (error) {
      const missing = error.code === 'PGRST202' || error.code === '42883' || /could not find|does not exist|schema cache/i.test(error.message || '');
      alert(missing ? 'شغّل ملف servant_phone.sql المحدّث على Supabase أولًا.' : 'تعذر الحذف: ' + (error.message || ''));
      return;
    }
    try { await sb.rpc('admin_remove_presence', { p_device: s.device_id }); } catch (e) {}   // يختفي من قائمة زملائه (servant_team.sql)
    try { await sb.rpc('admin_unlock_servant_role', { p_device: s.device_id }); } catch (e) {}   // يحذف صفته (servant_roles.sql)
    if (data === false) { showToast('هذا الخادم محذوف بالفعل'); }

    allServants.splice(i, 1);
    renderServantsAdmin();
  }

  // ================== تحليل أسباب الغياب ==================
  const ABS_REASONS_ADMIN = { sick: '🤒 مرض', travel: '✈️ سفر', exam: '📝 امتحانات', family: '👨‍👩‍👧 ظروف عائلية', noanswer: '📵 لا يرد', other: '❓ أخرى' };
  let reasonsRange = '30';

  function setReasonsRange(v) { reasonsRange = v; renderReasonsAdmin(); }

  function renderReasonsAdmin() {
    const wrap = document.getElementById('reasonsView');
    if (!wrap) return;
    let cutoff = '';
    if (reasonsRange !== 'all') { const d = new Date(); d.setDate(d.getDate() - parseInt(reasonsRange, 10)); cutoff = localDateStr(d); }

    const totals = {}; let absent = 0, withReason = 0;
    const perClass = [];
    (allClasses || []).forEach(c => {
      const d = c.data || {}, att = d.attendance || {}, rs = d.absenceReasons || {};
      const row = { name: c.class_name || 'بدون اسم', total: 0, rec: 0, by: {} };
      Object.keys(att).forEach(date => {
        if (cutoff && date < cutoff) return;
        Object.keys(att[date] || {}).forEach(id => {
          if (att[date][id] !== 'absent') return;
          row.total++; absent++;
          const k = (rs[date] || {})[id];
          if (k && ABS_REASONS_ADMIN[k]) { row.rec++; withReason++; row.by[k] = (row.by[k] || 0) + 1; totals[k] = (totals[k] || 0) + 1; }
        });
      });
      if (row.total) perClass.push(row);
    });
    perClass.sort((a, b) => b.total - a.total);

    const keys = Object.keys(ABS_REASONS_ADMIN).sort((a, b) => (totals[b] || 0) - (totals[a] || 0));
    const max = Math.max(1, ...keys.map(k => totals[k] || 0));
    const pct = absent ? Math.round(withReason / absent * 100) : 0;

    wrap.innerHTML = `
      <div class="an-form" style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">

          <select onchange="setReasonsRange(this.value)" style="padding:8px 12px;border:2px solid var(--line);border-radius:10px;font-family:inherit;">
            ${[['30', 'آخر ٣٠ يوماً'], ['90', 'آخر ٩٠ يوماً'], ['365', 'آخر سنة'], ['all', 'كل الفترة']].map(o => `<option value="${o[0]}" ${o[0] === reasonsRange ? 'selected' : ''}>${o[1]}</option>`).join('')}
          </select>
        </div>
        <div class="an-row">
          <div class="stu-stat-card"><div class="num">${absent}</div><div class="lbl">إجمالي الغيابات</div></div>
          <div class="stu-stat-card"><div class="num">${pct}%</div><div class="lbl">سُجِّل سببها (${withReason})</div></div>
        </div>
        ${withReason ? keys.map(k => `
          <div>
            <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:3px;"><span>${ABS_REASONS_ADMIN[k]}</span><span>${totals[k] || 0}</span></div>
            <div style="height:10px;background:#eee;border-radius:6px;"><div style="width:${Math.round((totals[k] || 0) / max * 100)}%;height:100%;background:var(--accent);border-radius:6px;"></div></div>
          </div>`).join('') : '<div class="empty-state" style="padding:16px;"><div class="ic">📭</div>لا توجد أسباب مسجّلة في هذه الفترة. يظهر اختيار السبب للخادم أسفل زر «غائب» في كشف الحضور.</div>'}
      </div>
      ${perClass.length ? `<div class="sv-wrap"><table class="data-table"><thead><tr><th>الفصل</th><th>الغيابات</th><th>سُجِّل سببها</th><th>التوزيع</th></tr></thead><tbody>
        ${perClass.map(r => `<tr><td style="font-weight:700;">${escapeHtml(r.name)}</td><td>${r.total}</td><td>${r.rec}</td>
          <td>${Object.keys(r.by).sort((a, b) => r.by[b] - r.by[a]).map(k => `<span class="chip">${ABS_REASONS_ADMIN[k]} ${r.by[k]}</span>`).join(' ') || '<span style="color:#aaa;">—</span>'}</td></tr>`).join('')}
      </tbody></table></div>` : ''}`;
  }

  // ================== كشف الأسماء المتكررة والأرقام المشتركة (إخوة) ==================
  function normNameAr(t) {
    return String(t || '').replace(/[\u064B-\u0652\u0640]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
      .replace(/\s+/g, ' ').trim().toLowerCase();
  }
  function normPhoneKey(p) {
    const dg = String(p || '').replace(/[٠-٩]/g, x => '٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/\D/g, '');
    return dg.length >= 9 ? dg.slice(-10) : '';
  }

    all.forEach(x => {

    const member = x => `
      <div class="gsearch-result" onclick="openDetail('${escapeHtml(x.classId)}'); setTimeout(()=>openStudentModal('${escapeHtml(String(x.s.id))}'), 150)">

        ${nameGroups.length ? cap(nameGroups, 60).map(g => `<div style="border:1px solid var(--cream);border-radius:12px;padding:8px;">${g.map(member).join('')}</div>`).join('')
          : '<div class="empty-state" style="padding:14px;"><div class="ic">✅</div>لا توجد أسماء متكررة.</div>'}
      </div>
      <div class="an-form">
        <div style="font-weight:900;font-size:16px;">👨‍👩‍👧 أرقام هاتف مشتركة (${phoneGroups.length})</div>
        <div style="font-size:12.5px;color:#666;line-height:1.7;">أكثر من مخدوم برقم هاتف واحد — غالباً إخوة، فيكفي افتقادهم في اتصال واحد. وإن كان الاسم نفسه فراجع القائمة أعلاه.</div>
        ${phoneGroups.length ? cap(phoneGroups, 60).map(([k, g]) => `<div style="border:1px solid var(--cream);border-radius:12px;padding:8px;">
            <div style="font-size:12px;color:#888;margin:0 4px 4px;">📞 ${escapeHtml(k)} — ${g.length} مخدومين</div>${g.map(member).join('')}</div>`).join('')
          : '<div class="empty-state" style="padding:14px;"><div class="ic">—</div>لا توجد أرقام مشتركة.</div>'}
      </div>`;
  }

  // ================== نقل مخدوم إلى فصل آخر بكل سجله ==================
  const TRANSFER_KEYS = ['attendance', 'notes', 'recitations', 'recitationDone', 'confessions', 'massAttendance', 'followup', 'absenceReasons'];

  // ينقل كل ما يخص المخدوم (مباشرة o[id] أو داخل التواريخ o[date][id]) من نسخة الفصل المصدر إلى الهدف
  function moveStudentRecords(src, dst, oldId, newId) {
    const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
    TRANSFER_KEYS.forEach(k => {
      const o = src[k];
      if (!o || typeof o !== 'object') return;
      if (has(o, oldId)) { dst[k] = dst[k] || {}; dst[k][newId] = o[oldId]; delete o[oldId]; }
      Object.keys(o).forEach(key => {
        const v = o[key];
        if (v && typeof v === 'object' && !Array.isArray(v) && has(v, oldId)) {
          dst[k] = dst[k] || {}; dst[k][key] = dst[k][key] || {};
          dst[k][key][newId] = v[oldId]; delete v[oldId];
        }
      });
    });
  }

    const cls = currentDetailClass;

    ov.innerHTML = `<div style="background:#fff;border-radius:16px;max-width:420px;width:100%;padding:18px;font-family:inherit;">

      <select id="transferTarget" style="width:100%;padding:10px;border:2px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;">

    document.getElementById('transferGo').onclick = () => {

      transferStudentAdmin(studentId, t);
    };

  async function transferStudentAdmin(studentId, targetId) {
    const src = currentDetailClass;
    if (!src || targetId === src.class_id) return;
    const tgt = (allClasses || []).find(c => c.class_id === targetId);
    if (!tgt) return;
    const btn = document.getElementById('transferGo');
    if (btn) { btn.disabled = true; btn.textContent = 'جاري النقل...'; }
    const fail = m => { if (btn) { btn.disabled = false; btn.textContent = 'نقل'; } showToast(m); };

    // أحدث نسخة من السحابة للفصلين حتى لا نكتب فوق تعديلات الخدام
    const [rs, rt] = await Promise.all([
      sb.from('class_records').select('data').eq('class_id', src.class_id).single(),
      sb.from('class_records').select('data').eq('class_id', targetId).single()
    ]);
    if (rs.error || !rs.data || rt.error || !rt.data) { fail('⚠️ تعذر قراءة بيانات الفصلين: ' + ((rs.error || rt.error || {}).message || '')); return; }
    const sd = rs.data.data || {}, td = rt.data.data || {};
    const st = (sd.students || []).find(x => x.id === studentId);
    if (!st) { fail('هذا المخدوم لم يعد موجوداً في الفصل'); return; }
    if (!Array.isArray(td.students)) td.students = [];

    if (td.students.some(x => normNameAr(x.name) === normNameAr(st.name)) &&
        !confirm('⚠️ يوجد في الفصل الهدف مخدوم بنفس الاسم «' + (st.name || '') + '». هل تريد المتابعة؟')) { fail('تم الإلغاء'); return; }

    // رقم المخدوم: نبقيه إن كان غير مستخدم في الفصل الهدف، وإلا نضيف له لاحقة
    let newId = st.id;
    if (td.students.some(x => x.id === newId)) {
      let n = 1; while (td.students.some(x => x.id === String(st.id) + '-' + n)) n++;
      newId = String(st.id) + '-' + n;
    }

    moveStudentRecords(sd, td, studentId, newId);
    td.students.push({ ...st, id: newId });
    sd.students = (sd.students || []).filter(x => x.id !== studentId);

    const by = (window._adminEmail ? window._adminEmail.split('@')[0] : 'مشرف') + ' (' + adminAsLabel() + ')';
    const now = new Date().toISOString();
    [[sd, 'out', tgt.class_name, studentId], [td, 'in', src.class_name, newId]].forEach(([d, dir, other, id]) => {
      if (!Array.isArray(d.activityLog)) d.activityLog = [];
      d.activityLog.push({ t: 'transfer_student', dir, other: other || '', by, at: now, studentId: id, studentName: st.name });
      if (d.activityLog.length > 300) d.activityLog = d.activityLog.slice(-300);
    });

    const write = (id, d) => sb.from('class_records').update({ data: d, updated_at: now }).eq('class_id', id).select('class_id');
    // نكتب الفصل الهدف أولاً: لو فشل ما بعده يبقى المخدوم في فصله (لا فقد بيانات)، وأسوأ حالة نسخة مكررة
    const w1 = await write(targetId, td);
    if (w1.error || !w1.data || !w1.data.length) { fail('تعذر الكتابة في الفصل الهدف: ' + (w1.error ? w1.error.message : 'الحساب لا يملك صلاحية تعديل بيانات الفصل (شغّل ملف delete_student_policy.sql على Supabase).')); return; }
    tgt.data = td; tgt.updated_at = now;
    const w2 = await write(src.class_id, sd);
    if (w2.error || !w2.data || !w2.data.length) {
      alert('⚠️ تم نسخ «' + (st.name || '') + '» إلى الفصل الجديد، لكن تعذر حذفه من الفصل القديم (' + (w2.error ? w2.error.message : 'بدون صلاحية') + ').\nاحذفه من الفصل القديم يدوياً حتى لا يتكرر.');
      renderClassGrid(); return;
    }
    src.data = sd; src.updated_at = now;
    const ov = document.getElementById('transferOverlay'); if (ov) ov.remove();
    closeStudentModal();
    renderStudentsPanel(sd);
    renderAttendancePanel(sd);
    renderClassGrid();
    showToast('🔀 تم نقل «' + (st.name || '') + '» إلى «' + (tgt.class_name || 'الفصل الجديد') + '»');
  }

  // ================== إعلانات المشرف العام للخدام ==================
  let allAnnouncements = [];
  // ---- صفة الناشر: أمين خدمة عام (general) / أب كاهن مشرف (priest) ----
  // تُخزَّن داخل العنوان كعلامة غير مرئية في أوله (بدون تغيير قاعدة البيانات)
  const AS_NAMES = { general: 'أمين خدمة عام', priest: 'أب كاهن مشرف' };
  // العلامة غير المرئية في أول العنوان: ⁣K<الاسم>⁣  حيث K = G (أمين خدمة عام) أو P (أب كاهن مشرف)
  function markFor(kind, name) { return '\u2063' + (kind === 'priest' ? 'P' : 'G') + String(name || '').replace(/\u2063/g, '').trim() + '\u2063'; }
  function adminAs() { try { return localStorage.getItem('wg_admin_title') === 'priest' ? 'priest' : 'general'; } catch (e) { return 'general'; } }
  function adminAsLabel() { return AS_NAMES[adminAs()]; }
  function adminSavedName() { try { return localStorage.getItem('wg_admin_name') || ''; } catch (e) { return ''; } }
  function decodeAnTitle(t) {
    t = String(t || '');
    if (t.charAt(0) === '\u2063' && (t.charAt(1) === 'P' || t.charAt(1) === 'G')) {
      const end = t.indexOf('\u2063', 2);
      if (end > 1) return { kind: t.charAt(1) === 'P' ? 'priest' : 'general', name: t.slice(2, end), title: t.slice(end + 1) };
    }
    return { kind: '', name: '', title: t };
  }
  const AN_MISSING = e => e && (e.code === 'PGRST202' || e.code === '42883' || e.code === '42P01' || /could not find|does not exist|schema cache/i.test(e.message || ''));
  const anEl = id => document.getElementById(id);
  const localDateStr = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  function buildAnnouncementsForm() {
    const wrap = anEl('announcementsView');
    const classNames = [...new Set((allClasses || []).map(c => (c.class_name || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ar'));
    const week = new Date(); week.setDate(week.getDate() + 7);
    wrap.innerHTML = `
      <div class="an-form" id="anForm">
        <div style="font-weight:900;font-size:16px;">📢 إعلان جديد للخدام</div>
        <div><label for="anAs">النشر بصفة</label>
          <select id="anAs" onchange="try{localStorage.setItem('wg_admin_title',this.value)}catch(e){}">
            <option value="general" ${adminAs() === 'general' ? 'selected' : ''}>🛡️ أمين خدمة عام</option>
            <option value="priest" ${adminAs() === 'priest' ? 'selected' : ''}>✝️ أب كاهن مشرف</option>

  function onAnTargetChange() {
    const t = anEl('anTarget').value;

    anEl('anClassBox').style.display = t === 'class' ? 'block' : 'none';

  async function loadAnnouncementsAdmin() {
    if (!anEl('anForm')) buildAnnouncementsForm();
    const list = anEl('anList');
    list.innerHTML = '<div class="empty-state"><div class="ic">⏳</div>جاري تحميل الإعلانات...</div>';
    const { data, error } = await sb.rpc('admin_list_announcements');
    if (error) {
      list.innerHTML = '<div class="empty-state"><div class="ic">⚠️</div>' +
        (AN_MISSING(error) ? 'شغّل ملف announcements.sql على Supabase أولاً.' : 'تعذر تحميل الإعلانات: ' + escapeHtml(error.message || '')) + '</div>';
      return;
    }
    allAnnouncements = data || [];
    renderAnnouncementsAdmin();
  }

  function renderAnnouncementsAdmin() {
    const list = anEl('anList');
    if (!list) return;
    if (!allAnnouncements.length) { list.innerHTML = '<div class="empty-state"><div class="ic">📭</div>لا توجد إعلانات بعد.</div>'; return; }
    const fmt = iso => { try { return new Date(iso).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' }); } catch (e) { return ''; } };
    const now = Date.now();
    list.innerHTML = allAnnouncements.map((a0, i) => {
      const dec = decodeAnTitle(a0.title);
      const a = Object.assign({}, a0, { title: dec.title });
      const active = !a.expires_at || new Date(a.expires_at).getTime() > now;
      const target = a.target_type === 'stage' ? '📚 ' + (STAGE_NAMES[a.target_value] || a.target_value)
                   : a.target_type === 'class' ? '🏫 ' + a.target_value : '📣 كل الخدام';
      const asChip = dec.kind === 'priest' ? '<span class="chip" style="background:#000;color:#f1d98a;border:1px solid #d4a017;">✝ أب كاهن مشرف' + (dec.name ? ' — ' + escapeHtml(dec.name) : '') + '</span>'
                   : dec.kind === 'general' ? '<span class="chip" style="background:#fde4e1;color:#a82a1e;">🛡️ أمين خدمة عام' + (dec.name ? ' — ' + escapeHtml(dec.name) : '') + '</span>' : '';
      return `<div class="an-item ${active ? '' : 'off'}" ${dec.kind === 'priest' ? 'style="background:#111;color:#fff;border-color:#d4a017;"' : ''}>
        ${a.title ? `<div class="an-t">${escapeHtml(a.title)}</div>` : ''}
        <div class="an-tx">${escapeHtml(a.body)}</div>
        <div class="an-meta">
          ${asChip}
          <span class="chip ${active ? 'green' : ''}">${active ? '🟢 نشط' : '⚪ منتهي'}</span>
          <span class="chip blue">${escapeHtml(target)}</span>
          <span>نُشر ${escapeHtml(fmt(a.created_at))}${a.created_by ? ' • ' + escapeHtml(a.created_by) : ''}</span>
          <span>${a.expires_at ? (active ? 'ينتهي ' : 'انتهى ') + escapeHtml(fmt(a.expires_at)) : 'بدون تاريخ انتهاء'}</span>
        </div>
        <div class="an-act">
          ${active ? `<button class="sv-edit" onclick="expireAnnouncement(${i})">⏹️ إنهاء الآن</button>` : ''}
          <button class="sv-edit" style="color:var(--accent);" onclick="deleteAnnouncement(${i})">🗑️ حذف</button>
        </div>
      </div>`;
    }).join('');
  }

  async function createAnnouncement() {
    const asKind = anEl('anAs') && anEl('anAs').value === 'priest' ? 'priest' : 'general';
    try { localStorage.setItem('wg_admin_title', asKind); } catch (e) {}
    const plainTitle = (anEl('anTitle').value || '').trim();
    const pubName = ((anEl('anName') && anEl('anName').value) || '').trim() || (window._adminEmail ? window._adminEmail.split('@')[0] : 'مشرف');
    try { localStorage.setItem('wg_admin_name', pubName); } catch (e) {}
    const title = markFor(asKind, pubName) + plainTitle;
    const body = (anEl('anBody').value || '').trim();
    const type = anEl('anTarget').value;
    let val = '';
    if (type === 'stage') val = anEl('anStage').value;
    if (type === 'class') val = (anEl('anClass').value || '').replace(/\s+/g, ' ').trim();
    if (!body) { showToast('⚠️ اكتب نص الإعلان'); return; }
    if (type === 'class' && !val) { showToast('⚠️ اكتب اسم الفصل'); return; }
    let exp = null;
    if (!anEl('anNoExp').checked) {
      const d = anEl('anDate').value;
      if (!d) { showToast('⚠️ اختر تاريخ الانتهاء أو فعّل «بدون تاريخ انتهاء»'); return; }
      const dt = new Date(d + 'T23:59:59');
      if (isNaN(dt) || dt.getTime() < Date.now()) { showToast('⚠️ تاريخ الانتهاء يجب أن يكون اليوم أو بعده'); return; }
      exp = dt.toISOString();
    }
    const by = pubName + ' (' + AS_NAMES[asKind] + ')';
    const btn = anEl('anSend'); btn.disabled = true; btn.textContent = 'جاري النشر...';
    const { error } = await sb.rpc('admin_create_announcement', {
      p_title: title, p_body: body, p_target_type: type, p_target_value: val, p_expires: exp, p_by: by
    });
    btn.disabled = false; btn.textContent = '📤 نشر الإعلان';
    if (error) { showToast(AN_MISSING(error) ? '⚠️ شغّل ملف announcements.sql على Supabase أولاً' : '⚠️ تعذر النشر: ' + (error.message || '')); return; }
    anEl('anTitle').value = ''; anEl('anBody').value = '';
    showToast('✅ تم نشر الإعلان — يصل للخدام كإشعار على أجهزتهم');
    try { PushClient.announce({ title: plainTitle, by_kind: asKind, by_name: pubName, body: body, target_type: type, target_value: val }); } catch (e) {}
    loadAnnouncementsAdmin();
  }

  async function expireAnnouncement(i) {
    const a = allAnnouncements[i];
    if (!a || !confirm('إنهاء هذا الإعلان الآن؟ سيختفي من عند الخدام.')) return;
    const { error } = await sb.rpc('admin_expire_announcement', { p_id: a.id });
    if (error) { showToast('⚠️ تعذر الإنهاء: ' + (error.message || '')); return; }
    showToast('⏹️ تم إنهاء الإعلان');
    loadAnnouncementsAdmin();
  }

  async function deleteAnnouncement(i) {
    const a = allAnnouncements[i];
    if (!a || !confirm('🗑️ حذف الإعلان نهائياً؟')) return;
    const { error } = await sb.rpc('admin_delete_announcement', { p_id: a.id });
    if (error) { showToast('⚠️ تعذر الحذف: ' + (error.message || '')); return; }
    showToast('🗑️ تم حذف الإعلان');
    loadAnnouncementsAdmin();
  }

  async function editServantClass(i) {
    const s = allServants[i];
    if (!s) return;
    const v = prompt('اسم الفصل التابع له ' + (s.name || '') + ' (يجب أن يطابق اسم الفصل في النظام):', s.class_name || '');
    if (v === null) return;
    const cls = v.replace(/\s+/g, ' ').trim().slice(0, 80);
    const { error } = await sb.rpc('admin_set_servant_class', { p_device: s.device_id, p_class: cls });
    if (error) {
      const missing = error.code === 'PGRST202' || error.code === '42883' || /could not find|does not exist|schema cache/i.test(error.message || '');
      showToast(missing ? '⚠️ شغّل ملف servant_class.sql على Supabase أولاً' : '⚠️ تعذر الحفظ: ' + (error.message || ''));
      return;
    }
    s.class_name = cls;
    renderServantsAdmin();
    showToast('✅ تم حفظ اسم الفصل');
  }

        list.push({

  // ================== البحث الشامل عن مخدوم في كل الفصول ==================
  function renderGlobalSearch() {
    const q = (document.getElementById('globalSearchBox').value || '').trim().toLowerCase();
    const resultsWrap = document.getElementById('globalSearchResults');
    const classesView = document.getElementById('classesView');
    const pastoralView = document.getElementById('pastoralView');
    const servantsView = document.getElementById('servantsView');

    if (!q) {
      resultsWrap.innerHTML = '';

      classesView.style.display = document.getElementById('navClasses').style.opacity !== '.65' ? 'block' : 'none';
      pastoralView.style.display = document.getElementById('navPastoral').style.opacity !== '.65' ? 'block' : 'none';
      servantsView.style.display = document.getElementById('navServants').style.opacity !== '.65' && document.getElementById('navServants').style.opacity !== '' ? 'block' : 'none';
      return;
    }

    classesView.style.display = 'none';
    pastoralView.style.display = 'none';
    servantsView.style.display = 'none';
    resultsWrap.style.display = 'block';

        <span class="chip blue">عرض البروفايل ←</span>
