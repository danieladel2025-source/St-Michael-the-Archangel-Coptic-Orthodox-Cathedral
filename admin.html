  // ================== بروفايل الطفل الكامل ==================
  function openStudentModal(studentId) {
    if (!currentDetailClass) return;
    const d = currentDetailClass.data || {};
    const s = (d.students || []).find(x => x.id === studentId);
    if (!s) return;

    const confessions = d.confessions || {};
    const massAttendance = d.massAttendance || {};
    const attendance = d.attendance || {};
    const pct = computeAttendancePct(s.id, attendance);

    document.getElementById('stuTitle').textContent = s.name || 'بدون اسم';
    document.getElementById('stuDeleteBtn').onclick = () => deleteStudentAdmin(s.id);
    document.getElementById('stuTransferBtn').onclick = () => transferStudentDialog(s.id);
    document.getElementById('stuMeta').textContent = 'فصل: ' + (currentDetailClass.class_name || '—');

    const photoHtml = s.photo
      ? `<img class="stu-photo" src="${s.photo}" alt="${escapeHtml(s.name || '')}">`
      : `<div class="stu-photo-placeholder">👤</div>`;

    const fields = [
      ['تاريخ الميلاد', s.dob], ['المدرسة', s.school], ['الصف الدراسي', s.class],
      ['أب الاعتراف', s.confessor], ['هاتف الأب', s.phone], ['هاتف الأم', s.phone2],
      ['هاتف شخصي', s.ownPhone], ['العنوان', s.address]
    ];

    const fieldsHtml = fields.map(([lbl, val]) => `
      <div class="stu-field"><span class="lbl">${lbl}</span><span class="val">${escapeHtml(val || '—')}</span></div>
    `).join('');

    let body = `
      <div class="stu-row">
        ${photoHtml}
        <div class="stu-info-grid">${fieldsHtml}</div>
      </div>
      <div class="stu-stats-row">
        <div class="stu-stat-card"><div class="num">${pct === null ? '—' : pct + '%'}</div><div class="lbl">نسبة الحضور</div></div>
        <div class="stu-stat-card"><div class="num">${confessions[s.id] || 0}</div><div class="lbl">مرات الاعتراف</div></div>
        <div class="stu-stat-card"><div class="num">${massAttendance[s.id] || 0}</div><div class="lbl">حضور القداس</div></div>
      </div>`;

    if (s.extraNotes) {
      body += `<div class="no-data" style="text-align:right;padding:0 24px 14px;">📝 ملاحظات: ${escapeHtml(s.extraNotes)}</div>`;
    }

    const dates = Object.keys(attendance).sort().reverse().filter(date => attendance[date][s.id]);
    body += `<div class="stu-log-title">📅 سجل الحضور التفصيلي (${dates.length} يوم مسجّل)</div>`;
    if (!dates.length) {
      body += `<div class="no-data">لا يوجد سجل حضور لهذا المخدوم بعد.</div>`;
    } else {
      const statusLabel = { present: ['حاضر', 'var(--green)'], absent: ['غائب', 'var(--accent)'], late: ['متأخر', 'var(--gold)'] };
      body += `<div class="stu-log-wrap"><table class="data-table"><tbody>
        ${dates.map(date => {
          const st = attendance[date][s.id];
          const [label, color] = statusLabel[st] || [st, '#888'];
          const rk = st === 'absent' ? ((d.absenceReasons || {})[date] || {})[s.id] : '';
          const rl = rk && ABS_REASONS_ADMIN[rk] ? ` <span style="font-weight:400;color:#777;font-size:12px;">— ${ABS_REASONS_ADMIN[rk]}</span>` : '';
          return `<tr><td style="font-weight:700;">${date}</td><td style="color:${color};font-weight:700;">${label}${rl}</td></tr>`;
        }).join('')}
      </tbody></table></div>`;
    }

    document.getElementById('stuBody').innerHTML = body;
    document.getElementById('studentOverlay').style.display = 'flex';
  }

  // ================== حذف مخدوم غير مرغوب فيه (من لوحة المشرفين) ==================
  async function deleteStudentAdmin(studentId) {
    const cls = currentDetailClass;
    if (!cls) return;
    const s0 = ((cls.data || {}).students || []).find(x => x.id === studentId);
    if (!s0) return;
    const nm = s0.name || 'بدون اسم';
    if (!confirm('🗑️ حذف المخدوم «' + nm + '» من فصل «' + (cls.class_name || '—') + '»؟\n\nسيُحذف معه سجل حضوره واعترافه وملاحظاته ومتابعته نهائيًا.')) return;
    if (!confirm('⚠️ تأكيد أخير: لا يمكن التراجع عن حذف «' + nm + '». هل أنت متأكد؟')) return;

    // نقرأ أحدث نسخة من السحابة أولًا حتى لا نكتب فوق تعديلات الخدام
    const { data: fresh, error: e1 } = await sb.from('class_records').select('data').eq('class_id', cls.class_id).single();
    if (e1 || !fresh) { showToast('⚠️ تعذر قراءة بيانات الفصل: ' + ((e1 && e1.message) || '')); return; }
    const d = fresh.data || {};
    const st = (d.students || []).find(x => x.id === studentId);
    if (!st) { showToast('هذا المخدوم محذوف بالفعل'); await loadAllClasses(); closeStudentModal(); closeDetail(); return; }

    d.students = (d.students || []).filter(x => x.id !== studentId);
    // حذف كل ما يخص المخدوم (سواء كان مفتاحه مباشرًا أو داخل تاريخ/يوم)
    ['attendance', 'notes', 'recitations', 'recitationDone', 'confessions', 'massAttendance', 'followup', 'absenceReasons'].forEach(k => {
      const o = d[k];
      if (!o || typeof o !== 'object') return;
      delete o[studentId];
      Object.keys(o).forEach(key => {
        const v = o[key];
        if (v && typeof v === 'object' && !Array.isArray(v)) delete v[studentId];
      });
    });
    if (!Array.isArray(d.activityLog)) d.activityLog = [];
    d.activityLog.push({ t: 'delete_student', by: (window._adminEmail ? window._adminEmail.split('@')[0] : 'مشرف') + ' (' + adminAsLabel() + ')', at: new Date().toISOString(), studentId, studentName: nm });
    if (d.activityLog.length > 300) d.activityLog = d.activityLog.slice(-300);

    const { data: upd, error: e2 } = await sb.from('class_records')
      .update({ data: d, updated_at: new Date().toISOString() })
      .eq('class_id', cls.class_id).select('class_id');
    if (e2 || !upd || !upd.length) {
      alert('تعذر الحذف: ' + (e2 ? e2.message : 'الحساب لا يملك صلاحية تعديل بيانات الفصل (شغّل ملف delete_student_policy.sql على Supabase).'));
      return;
    }
    cls.data = d;
    cls.updated_at = new Date().toISOString();
    closeStudentModal();
    renderStudentsPanel(d);
    renderAttendancePanel(d);
    renderClassGrid();
    showToast('🗑️ تم حذف المخدوم «' + nm + '»');
  }

  // ================== حذف خادم من كشف خدام الفصل (من لوحة المشرفين) ==================
  async function deleteServantAdmin(sid) {
    const cls = currentDetailClass;
    if (!cls) return;
    const sv0 = ((cls.data || {}).servants || []).find(x => String(x.sid) === String(sid));
    if (!sv0) return;
    const nm = sv0.name || 'بدون اسم';
    if (!confirm('🗑️ حذف الخادم «' + nm + '» من فصل «' + (cls.class_name || '—') + '»؟\n\nسيُحذف معه سجل حضوره نهائيًا.')) return;
    if (!confirm('⚠️ تأكيد أخير: لا يمكن التراجع عن حذف «' + nm + '». هل أنت متأكد؟')) return;

    // أحدث نسخة من السحابة أولًا حتى لا نكتب فوق تعديلات الخدام
    const { data: fresh, error: e1 } = await sb.from('class_records').select('data').eq('class_id', cls.class_id).single();
    if (e1 || !fresh) { showToast('⚠️ تعذر قراءة بيانات الفصل: ' + ((e1 && e1.message) || '')); return; }
    const d = fresh.data || {};
    if (!(d.servants || []).some(x => String(x.sid) === String(sid))) {
      showToast('هذا الخادم محذوف بالفعل'); await loadAllClasses(); closeDetail(); return;
    }

    d.servants = (d.servants || []).filter(x => String(x.sid) !== String(sid));
    const att = d.servantsAttendance;
    if (att && typeof att === 'object') {
      delete att[sid];
      Object.keys(att).forEach(date => {
        const v = att[date];
        if (v && typeof v === 'object' && !Array.isArray(v)) delete v[sid];
      });
    }
    if (!Array.isArray(d.activityLog)) d.activityLog = [];
    d.activityLog.push({ t: 'delete_servant', by: (window._adminEmail ? window._adminEmail.split('@')[0] : 'مشرف') + ' (' + adminAsLabel() + ')', at: new Date().toISOString(), studentName: nm });
    if (d.activityLog.length > 300) d.activityLog = d.activityLog.slice(-300);

    const { data: upd, error: e2 } = await sb.from('class_records')
      .update({ data: d, updated_at: new Date().toISOString() })
      .eq('class_id', cls.class_id).select('class_id');
    if (e2 || !upd || !upd.length) {
      alert('تعذر الحذف: ' + (e2 ? e2.message : 'الحساب لا يملك صلاحية تعديل بيانات الفصل (شغّل ملف delete_student_policy.sql على Supabase).'));
      return;
    }
    cls.data = d;
    cls.updated_at = new Date().toISOString();
    renderServantsPanel(d);
    renderClassGrid();
    showToast('🗑️ تم حذف الخادم «' + nm + '»');
  }

  function closeStudentModal() {
    document.getElementById('studentOverlay').style.display = 'none';
  }
</script>

  // ===== 💬 الشات المباشر (للمشرفين) — يرى كل الغرف ويستطيع حذف الرسائل =====
  LiveChat.init({
    role: 'admin',
    watchAll: true,
    getClient: function () { return window._adminEmail ? sb : null; },
    getIdentity: function () { return { name: 'مشرف' }; },
    getRooms: function () {
      if (!window._adminEmail) return [];
      var rooms = [{ id: 'general', label: 'عام' }];
      (allClasses || []).forEach(function (c) {
        rooms.push({ id: LiveChat.roomFor(c.class_id), label: c.class_name || 'بدون اسم' });
      });
      return rooms;
    }
  });
</script>
